apply plugin: 'java-library'

// Replace deprecated JavaPluginConvention with modern java {} block
java {
    sourceCompatibility = appJavaCompatibility
    targetCompatibility = appJavaCompatibility
}

dependencies {
    api project(':SPD-classes')
    
    // Add service dependencies
    api project(':services')

    
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    
    // Updated controllers dependency
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
    
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
}

// Add compiler options for warnings
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
    options.compilerArgs << "-Xlint:unchecked"
}